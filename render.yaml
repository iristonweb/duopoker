services:
  - type: web
    name: duopoker-api
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: pnpm install && pnpm --filter @duopoker/db-schema build && pnpm --filter @duopoker/shared-types build && pnpm --filter @duopoker/game-engine build && pnpm --filter @duopoker/backend build
    startCommand: pnpm --filter @duopoker/backend start
    envVars:
      - key: PORT
        value: 4000
      - key: MONGO_DB
        value: duopoker
      - key: ALLOW_SOLO_QUEUE
        value: "true"
      - key: MOCK_CHECKOUT
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        value: https://duopoker.ru
      - key: CORS_ORIGIN
        value: https://duopoker.ru,https://www.duopoker.ru,https://duopoker.vercel.app
      # Required — set in Render dashboard:
      # - DATABASE_URL  (Neon PostgreSQL connection string)
      # Optional:
      # - REDIS_URL     (Upstash — omit to use Postgres device_sessions only)
      # - MONGO_URL     (replays/analytics — API starts without it)
      # LiveKit voice (cloud.livekit.io → Project → Settings):
      # - LIVEKIT_API_KEY
      # - LIVEKIT_API_SECRET
      # - LIVEKIT_URL   (wss://xxx.livekit.cloud)
