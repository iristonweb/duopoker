services:
  - type: web
    name: duopoker-api
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: pnpm install && pnpm --filter @duopoker/db-schema build && pnpm --filter @duopoker/backend build
    startCommand: pnpm --filter @duopoker/backend start
    envVars:
      - key: PORT
        value: 4000
      - key: MONGO_DB
        value: duopoker
      - key: ALLOW_SOLO_QUEUE
        value: "true"
      - key: MOCK_CHECKOUT
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        value: https://duopoker.vercel.app
      - key: CORS_ORIGIN
        value: https://duopoker.vercel.app
      # Set these in Render dashboard after creation:
      # - DATABASE_URL
      # - REDIS_URL
      # - MONGO_URL
