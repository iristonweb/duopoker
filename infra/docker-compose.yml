version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: duopoker
      POSTGRES_PASSWORD: duopoker
      POSTGRES_DB: duopoker
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://duopoker:duopoker@postgres:5432/duopoker
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
      JWT_SECRET: dev-docker-jwt-change-me
      JWT_REFRESH_SECRET: dev-docker-jwt-refresh-change-me
      PUBLIC_WEB_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      ALLOW_SOLO_QUEUE: "true"
    depends_on:
      - postgres
      - redis
      - mongo

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  mongo_data:
