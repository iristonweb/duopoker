# Example reverse proxy for DuoPoker (TLS termination on host or CDN).

upstream duopoker_api {
  server 127.0.0.1:4000;
}

upstream duopoker_web {
  server 127.0.0.1:5173;
}

server {
  listen 80;
  server_name _;

  location /socket.io/ {
    proxy_pass http://duopoker_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://duopoker_web;
    proxy_set_header Host $host;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://duopoker_api;
    proxy_set_header Host $host;
  }
}
