<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" fill="none" role="img" aria-label="DP CLUB">
  <defs>
    <linearGradient id="lg-border" x1="0" y1="0" x2="240" y2="100">
      <stop stop-color="#f5e6a8"/>
      <stop offset="0.45" stop-color="#e8c547"/>
      <stop offset="1" stop-color="#b8942e"/>
    </linearGradient>
    <linearGradient id="lg-face" x1="20" y1="10" x2="220" y2="90">
      <stop stop-color="#14141f"/>
      <stop offset="0.55" stop-color="#0c0c12"/>
      <stop offset="1" stop-color="#1a1408"/>
    </linearGradient>
    <linearGradient id="lg-text" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5e6a8"/>
      <stop offset="1" stop-color="#e8c547"/>
    </linearGradient>
    <radialGradient id="lg-shine" cx="30%" cy="20%" r="70%">
      <stop stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="lg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="6" width="224" height="88" rx="10" fill="url(#lg-face)" stroke="url(#lg-border)" stroke-width="2.5"/>
  <rect x="8" y="6" width="224" height="88" rx="10" fill="url(#lg-shine)"/>
  <rect x="14" y="12" width="212" height="76" rx="7" stroke="#e8c547" stroke-opacity="0.24" stroke-width="1"/>

  <text x="22" y="26" fill="#e8c547" fill-opacity="0.5" font-family="Georgia,serif" font-size="13">♠</text>
  <text x="218" y="82" fill="#e8c547" fill-opacity="0.5" font-family="Georgia,serif" font-size="13" text-anchor="end" transform="rotate(180 218 82)">♠</text>

  <g filter="url(#lg-glow)">
    <text x="120" y="50" text-anchor="middle" fill="url(#lg-text)" font-family="Georgia,serif" font-size="34" font-weight="700" letter-spacing="1">DP</text>
    <text x="120" y="72" text-anchor="middle" fill="#e8c547" fill-opacity="0.92" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="0.38em">CLUB</text>
  </g>

  <path d="M14 12 Q120 22 226 12" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" fill="none"/>
</svg>
