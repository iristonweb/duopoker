<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <pattern id="cardPat" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#050508"/>
      <rect x="20" y="25" width="28" height="40" rx="3" fill="#0a2e1f" opacity="0.12" transform="rotate(-12 34 45)"/>
      <circle cx="85" cy="75" r="14" fill="#e8c547" opacity="0.06"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop stop-color="#050508" stop-opacity="0"/>
      <stop offset="1" stop-color="#050508" stop-opacity="0.88"/>
    </radialGradient>
    <radialGradient id="feltGlow" cx="50%" cy="50%" r="45%">
      <stop stop-color="#4ade80" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#cardPat)"/>
  <ellipse cx="960" cy="540" rx="600" ry="280" fill="url(#feltGlow)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
