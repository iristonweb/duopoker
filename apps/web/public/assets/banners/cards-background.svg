<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080">
      <stop stop-color="#050508"/>
      <stop offset="0.45" stop-color="#0a1218"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="goldPool" cx="22%" cy="28%" r="38%">
      <stop stop-color="#e8c547" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e8c547" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldPool" cx="78%" cy="72%" r="42%">
      <stop stop-color="#4ade80" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5e6a8"/>
      <stop offset="0.5" stop-color="#e8c547"/>
      <stop offset="1" stop-color="#b8942e"/>
    </linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#goldPool)"/>
  <rect width="1920" height="1080" fill="url(#emeraldPool)"/>

  <!-- scattered cards -->
  <g opacity="0.55" filter="url(#softGlow)">
    <g transform="rotate(-18 320 260)">
      <rect x="260" y="180" width="88" height="124" rx="8" fill="#faf8f2" stroke="#e8c547" stroke-width="2"/>
      <text x="278" y="230" fill="#111" font-family="Georgia,serif" font-size="34" font-weight="700">A</text>
      <text x="278" y="270" fill="#111" font-family="Georgia,serif" font-size="28">`</text>
    </g>
    <g transform="rotate(14 1580 220)">
      <rect x="1520" y="150" width="88" height="124" rx="8" fill="#faf8f2" stroke="#e8c547" stroke-width="2"/>
      <text x="1538" y="200" fill="#b91c1c" font-family="Georgia,serif" font-size="34" font-weight="700">K</text>
      <text x="1538" y="240" fill="#b91c1c" font-family="Georgia,serif" font-size="28">e</text>
    </g>
    <g transform="rotate(-8 1640 780)">
      <rect x="1580" y="710" width="78" height="110" rx="7" fill="#faf8f2" stroke="#e8c547" stroke-width="1.8"/>
      <text x="1596" y="755" fill="#b91c1c" font-family="Georgia,serif" font-size="28" font-weight="700">Q</text>
      <text x="1596" y="788" fill="#b91c1c" font-family="Georgia,serif" font-size="24">f</text>
    </g>
    <g transform="rotate(22 240 820)">
      <rect x="180" y="750" width="78" height="110" rx="7" fill="#faf8f2" stroke="#e8c547" stroke-width="1.8"/>
      <text x="196" y="795" fill="#111" font-family="Georgia,serif" font-size="28" font-weight="700">J</text>
      <text x="196" y="828" fill="#111" font-family="Georgia,serif" font-size="24">c</text>
    </g>
  </g>

  <!-- chips -->
  <g opacity="0.7">
    <circle cx="420" cy="640" r="34" fill="url(#chipGrad)" stroke="#f5e6a8" stroke-width="2"/>
    <circle cx="420" cy="640" r="22" fill="none" stroke="#050508" stroke-width="1.2" opacity="0.35"/>
    <circle cx="1480" cy="420" r="28" fill="url(#chipGrad)" stroke="#f5e6a8" stroke-width="1.8"/>
    <circle cx="1480" cy="420" r="18" fill="none" stroke="#050508" stroke-width="1" opacity="0.35"/>
    <circle cx="960" cy="180" r="22" fill="url(#chipGrad)" stroke="#f5e6a8" stroke-width="1.5"/>
  </g>

  <!-- subtle suit watermark -->
  <text x="960" y="620" text-anchor="middle" fill="#e8c547" font-family="Georgia,serif" font-size="420" opacity="0.035">`</text>

  <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
    <stop stop-color="#050508" stop-opacity="0"/>
    <stop offset="1" stop-color="#050508" stop-opacity="0.72"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
