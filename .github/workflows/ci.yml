name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @duopoker/game-engine test
      - run: pnpm --filter @duopoker/db-schema build && pnpm --filter @duopoker/shared-types build
      - run: pnpm --filter @duopoker/game-engine build
      - run: node scripts/bundle-vercel-api.mjs
      - run: pnpm --filter @duopoker/backend build
      - run: pnpm --filter @duopoker/web build

  api-integration:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    env:
      HUSKY: "0"
      DATABASE_URL: postgresql://duopoker:duopoker@localhost:5434/duopoker
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars-long
      ALLOW_SOLO_QUEUE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duopoker
          POSTGRES_PASSWORD: duopoker
          POSTGRES_DB: duopoker
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U duopoker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @duopoker/db-schema build
      - run: pnpm --filter @duopoker/db-schema exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm --filter @duopoker/shared-types build
      - run: pnpm --filter @duopoker/game-engine build
      - run: pnpm --filter @duopoker/api test

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    env:
      HUSKY: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      ALLOW_OPEN_JOIN: "true"
      ALLOW_SOLO_QUEUE: "true"
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @duopoker/game-engine build
      - run: pnpm --filter @duopoker/shared-types build
      - run: pnpm --filter @duopoker/backend build

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chrome

      - name: Playwright E2E
        run: pnpm exec playwright test tests/web.e2e.spec.ts tests/table-mobile.e2e.spec.ts tests/table-leaderboard.e2e.spec.ts tests/game.e2e.spec.ts
