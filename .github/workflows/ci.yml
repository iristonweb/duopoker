name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @duopoker/game-engine test
      - run: pnpm --filter @duopoker/db-schema build && pnpm --filter @duopoker/shared-types build
      - run: pnpm --filter @duopoker/game-engine build
      - run: pnpm --filter @duopoker/backend build
      - run: pnpm --filter @duopoker/web build

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    env:
      HUSKY: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chrome

      - name: Playwright E2E
        run: pnpm exec playwright test tests/web.e2e.spec.ts
