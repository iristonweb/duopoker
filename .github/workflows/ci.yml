name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @duopoker/game-engine test
      - run: pnpm --filter @duopoker/db-schema build && pnpm --filter @duopoker/shared-types build
      - run: pnpm --filter @duopoker/game-engine build
      - run: pnpm --filter @duopoker/backend build
      - run: pnpm --filter @duopoker/web build
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-chromium-
      # Browser only — skip --with-deps (apt on GitHub runners often hangs 10+ min).
      # ubuntu-latest already has headless Chromium system libraries.
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - name: Playwright E2E
        timeout-minutes: 10
        run: pnpm exec playwright test tests/web.e2e.spec.ts
