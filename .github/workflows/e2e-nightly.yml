name: E2E Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-joker-match:
    uses: ./.github/workflows/reusable-socket-e2e.yml
    with:
      playwright_args: tests/game.e2e.spec.ts -g "full 24-hand"
      timeout_minutes: 45
      full_joker_match: true
