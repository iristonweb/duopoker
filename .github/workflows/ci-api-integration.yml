name: API Integration

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
    paths:
      - "packages/api/**"
      - "packages/game-engine/**"
      - "packages/shared-types/**"
      - "packages/db-schema/**"
      - ".github/workflows/ci-api-integration.yml"

concurrency:
  group: api-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      DATABASE_URL: postgresql://duopoker:duopoker@localhost:5434/duopoker
      DIRECT_DATABASE_URL: postgresql://duopoker:duopoker@localhost:5434/duopoker
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars-long
      ALLOW_SOLO_QUEUE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duopoker
          POSTGRES_PASSWORD: duopoker
          POSTGRES_DB: duopoker
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U duopoker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @duopoker/db-schema build
      - run: pnpm --filter @duopoker/db-schema exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm --filter @duopoker/shared-types build
      - run: pnpm --filter @duopoker/game-engine build
      - run: pnpm --filter @duopoker/api test:integration
